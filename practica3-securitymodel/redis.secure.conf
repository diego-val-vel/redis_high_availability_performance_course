########################################
# redis.secure.conf - controles mínimos efectivos
########################################

# puerto del servicio
port 6379

# aceptar conexiones dentro de la red del contenedor
bind 0.0.0.0

# modo protegido activado
protected-mode yes

# primer plano en Docker
daemonize no
pidfile /var/run/redis.pid

########################################
# autenticación y autorización
########################################

# cargar usuarios y permisos desde archivo ACL
aclfile /usr/local/etc/redis/users.acl

########################################
# comandos peligrosos deshabilitados
########################################

# deshabilitar FLUSHALL
rename-command FLUSHALL ""

# deshabilitar FLUSHDB
rename-command FLUSHDB ""

# deshabilitar CONFIG
rename-command CONFIG ""

# deshabilitar SHUTDOWN
rename-command SHUTDOWN ""

########################################
# observabilidad
########################################

# registrar comandos más lentos de 10 ms
slowlog-log-slower-than 10000
slowlog-max-len 256

# registrar eventos de latencia por encima de 100 ms
latency-monitor-threshold 100

########################################
# persistencia
########################################

# activar AOF y consolidar cada segundo
appendonly yes
appendfsync everysec

# sin snapshots RDB en este montaje
save ""

# directorio de datos
dir /data
