services:
  # 1) Instancia original base
  redis:
    image: redis:7-alpine
    container_name: redis-m1m3
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  # 2) RedisInsight
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - redis-net

  # 3) Instancias para particionamiento a nivel aplicación
  redis-app-a:
    image: redis:7-alpine
    container_name: redis-m5-app-a
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6382:6379"
    volumes:
      - redis_app_a_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  redis-app-b:
    image: redis:7-alpine
    container_name: redis-m5-app-b
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6383:6379"
    volumes:
      - redis_app_b_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  # 4) Topología master + replicas para Sentinel
  redis-master:
    image: redis:7-alpine
    container_name: redis-m5-master
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"          # master escuchando en el host en 6380
    volumes:
      - redis_master_data:/data
    restart: unless-stopped
    networks:
      - redis-net            # dentro de la red, nombre: redis-m5-master

  redis-replica1:
    image: redis:7-alpine
    container_name: redis-m5-replica1
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "redis-m5-master", "6379"]
    ports:
      - "6381:6379"
    volumes:
      - redis_replica1_data:/data
    depends_on:
      - redis-master
    restart: unless-stopped
    networks:
      - redis-net

  redis-replica2:
    image: redis:7-alpine
    container_name: redis-m5-replica2
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "redis-m5-master", "6379"]
    ports:
      - "6384:6379"
    volumes:
      - redis_replica2_data:/data
    depends_on:
      - redis-master
    restart: unless-stopped
    networks:
      - redis-net

  # 5) Tres procesos Sentinel EN LA MISMA RED DOCKER
  # OJO: los configs sentinel1.conf/2/3 los va a generar el script con la IP del master.
  sentinel1:
    image: redis:7-alpine
    container_name: redis-m5-sentinel1
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    volumes:
      - ./sentinel1.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica1
      - redis-replica2
    ports:
      - "26379:26379"        # Sentinel1 accesible desde el host
    restart: unless-stopped
    networks:
      - redis-net            # misma red que master y replicas

  sentinel2:
    image: redis:7-alpine
    container_name: redis-m5-sentinel2
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    volumes:
      - ./sentinel2.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica1
      - redis-replica2
    ports:
      - "26380:26379"        # host 26380 -> sentinel interno 26379
    restart: unless-stopped
    networks:
      - redis-net

  sentinel3:
    image: redis:7-alpine
    container_name: redis-m5-sentinel3
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    volumes:
      - ./sentinel3.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica1
      - redis-replica2
    ports:
      - "26381:26379"        # host 26381 -> sentinel interno 26379
    restart: unless-stopped
    networks:
      - redis-net

  # 6) Nodos de Redis Cluster
  cluster-node-1:
    image: redis:7-alpine
    container_name: redis-m5-cluster-1
    command: ["redis-server",
              "--appendonly", "yes",
              "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendfilename", "appendonly.aof"]
    ports:
      - "7001:6379"
    volumes:
      - cluster_node1_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  cluster-node-2:
    image: redis:7-alpine
    container_name: redis-m5-cluster-2
    command: ["redis-server",
              "--appendonly", "yes",
              "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendfilename", "appendonly.aof"]
    ports:
      - "7002:6379"
    volumes:
      - cluster_node2_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  cluster-node-3:
    image: redis:7-alpine
    container_name: redis-m5-cluster-3
    command: ["redis-server",
              "--appendonly", "yes",
              "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendfilename", "appendonly.aof"]
    ports:
      - "7003:6379"
    volumes:
      - cluster_node3_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  cluster-node-4:
    image: redis:7-alpine
    container_name: redis-m5-cluster-4
    command: ["redis-server",
              "--appendonly", "yes",
              "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendfilename", "appendonly.aof"]
    ports:
      - "7004:6379"
    volumes:
      - cluster_node4_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  cluster-node-5:
    image: redis:7-alpine
    container_name: redis-m5-cluster-5
    command: ["redis-server",
              "--appendonly", "yes",
              "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendfilename", "appendonly.aof"]
    ports:
      - "7005:6379"
    volumes:
      - cluster_node5_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  cluster-node-6:
    image: redis:7-alpine
    container_name: redis-m5-cluster-6
    command: ["redis-server",
              "--appendonly", "yes",
              "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendfilename", "appendonly.aof"]
    ports:
      - "7006:6379"
    volumes:
      - cluster_node6_data:/data
    restart: unless-stopped
    networks:
      - redis-net

volumes:
  redis_data:
  redis_app_a_data:
  redis_app_b_data:
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data:
  cluster_node1_data:
  cluster_node2_data:
  cluster_node3_data:
  cluster_node4_data:
  cluster_node5_data:
  cluster_node6_data:

networks:
  redis-net:
    driver: bridge
