services:
  # Servicio principal de Redis que actuará como master
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  # Replica del master. Se conectará a redis-master en el puerto 6379
  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "redis-master", "6379"]
    depends_on:
      - redis-master
    ports:
      - "6380:6379"
    volumes:
      - redis_replica1_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  # Instancia extra de Redis para simular otro shard o instancia adicional
  redis-extra:
    image: redis:7-alpine
    container_name: redis-extra
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redis_extra_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  # RedisInsight para monitorear visualmente los nodos Redis
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-extra
    ports:
      - "5540:5540"
    restart: unless-stopped
    networks:
      - redis-net

volumes:
  redis_master_data:
  redis_replica1_data:
  redis_extra_data:

networks:
  redis-net:
    driver: bridge
